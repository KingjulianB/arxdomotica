name: Arxdomotica
version: "0.1.0"
slug: arxdomotica
description: >-
  Interface simplifiée pour que vos clients gèrent leur domotique
  (utilisateurs, alarme Alarmo, appairage Zigbee) sans connaissances
  techniques.
url: "https://github.com/KingjulianB/arxdomotica"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-automation
homeassistant_api: true
hassio_api: true
# Exposed directly (not only via ingress) so a client with no Home Assistant
# account yet can still open an invite link — HA's own login would otherwise
# block access to the ingress panel before an account exists.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Accès direct (lien d'invitation / connexion client)
webui: "http://[HOST]:[PORT:8099]/"
services:
  - mqtt:want
options:
  ha_url: "http://homeassistant:8123"
  ha_admin_token: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  ha_url: url
  ha_admin_token: password
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
